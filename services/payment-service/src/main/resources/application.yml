server:
  port: 8080
spring:
  application:
    name: payment-service
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
    url: ${DB_URL:jdbc:postgresql://postgres:5432/food?currentSchema=payments}
    username: ${DB_USER:payments_app}
    password: ${DB_PASSWORD:payments_dev_only}
  flyway:
    default-schema: payments
    schemas: payments
  jackson:
    deserialization:
      fail-on-unknown-properties: true
paymoney:
  trust-account: ${PAYMONEY_TRUST_ACCOUNT:088-9000-000001}
payment:
  recovery-interval: ${PAYMENT_RECOVERY_INTERVAL_MS:15000}
settlement:
  # 23:30(Asia/Seoul) 일 마감. 앞 단계가 끝나야 다음 단계 진행(마감 → 결제원 차액 → 한국은행 → 대사·충전금 검사).
  cron: ${SETTLEMENT_CRON:0 30 23 * * *}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://otel-collector:4318/v1/traces
logging:
  structured:
    format:
      console: logstash
